name: Review job update
on:
  workflow_dispatch:
# Schedule deliberately disabled. Private input and reviewed source policy required.
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './collector[test]'
      - name: Load private configuration without logging it
        env:
          PROFILE: ${{ secrets.MIYAJOB_PROFILE_JSON }}
          SOURCES: ${{ secrets.MIYAJOB_SOURCES_YAML }}
        run: |
          python - <<'PY'
          import os, pathlib, json, yaml
          from collector.models import Profile
          profile = os.environ.get('PROFILE', '')
          sources = os.environ.get('SOURCES', '')
          if not profile or not sources:
              raise SystemExit('Private configuration missing; no collection performed.')
          Profile.model_validate_json(profile)
          pathlib.Path('config/profile.yaml').write_text(yaml.safe_dump(json.loads(profile)), encoding='utf-8')
          pathlib.Path('config/sources.yaml').write_text(sources, encoding='utf-8')
          PY
      - name: Collect approved sources and preserve previous data on error
        run: python -m collector update --network --sources config/sources.yaml
      - run: python -m collector validate
      - name: Provide public proposal only (never internal evidence or profile)
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-public-jobs
          path: web/public/jobs.json
          retention-days: 7
# Review new candidates locally. This workflow never auto-commits or auto-deploys.
