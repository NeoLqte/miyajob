name: Collect new job candidates
on:
  schedule:
    - cron: '0 0 * * 1' # Monday 09:00 JST, collection only
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './collector[test]'
      - name: Check source configuration without logging values
        id: config
        env:
          SOURCES: ${{ secrets.MIYAJOB_SOURCES_YAML }}
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          sources = os.environ.get('SOURCES', '')
          config = yaml.safe_load(sources) if sources else {}
          ready = bool(config and config.get('sources'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ready=' + str(ready).lower() + '\n')
          if ready:
              pathlib.Path('config/sources.yaml').write_text(sources, encoding='utf-8')
          else:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('No approved source configuration: collection not performed. Public data unchanged.\n')
          PY
      - name: Collect new candidates without applicant adjudication
        if: steps.config.outputs.ready == 'true'
        run: python -m collector update --mode collect --network --sources config/sources.yaml
      - run: python -m collector validate
      - name: Provide public proposal only
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collected-public-proposal
          path: |
            web/public/jobs.json
            web/public/review-jobs.json
          retention-days: 7
# Detailed investigation is local and explicitly selected with --mode investigate.
# No automatic publication. Publish actual openings after --discoveries minimum checks.
# No private profile or internal logs in artifacts.
